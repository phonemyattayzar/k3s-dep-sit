apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sar-mel-backend.fullname" . }}
  labels:
    {{- include "sar-mel-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secret.secretKey must be set when existingSecret is empty" .Values.secret.secretKey | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword must be set when existingSecret is empty" .Values.secret.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.database.user }}:{{ .Values.secret.postgresPassword }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"