apiVersion: v1
kind: Service
metadata:
  name: {{ include "sar-mel-backend.fullname" . }}
  labels:
    {{- include "sar-mel-backend.labels" . | nindent 4 }}
  {{- if .Values.service }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if .Values.service }}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- end }}
  selector:
    {{- include "sar-mel-backend.selectorLabels" . | nindent 4 }}
