replicaCount: 1

image:
  repository: 051131628511.dkr.ecr.ap-southeast-1.amazonaws.com/sar-mel-backend
  tag: latest
  pullPolicy: Always

# Refreshed every six hours by the ECR pull-secret CronJob.
imagePullSecrets:
  - name: ecr-pull-secret

ingress:
  enabled: false

autoscaling:
  enabled: false

database:
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  name: "appdb"
  user: "appuser"

secret:
  postgresPassword: "admin123"

# Create this Secret in the release namespace before the first Argo CD sync.
# Required keys: SECRET_KEY, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# DATABASE_URL. Keep secret values outside Git (for example, SOPS/External
# Secrets); never put production credentials in this values file.
existingSecret: ""

migration:
  enabled: true

persistence:
  enabled: true
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /app/uploads

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: false

service:
  type: ClusterIP
  port: 8000
  annotations: {}

config:
  algorithm: "HS256"
  accessTokenExpireMinutes: "11520"

route:
  enabled: false

podAnnotations: {}
podLabels: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi



