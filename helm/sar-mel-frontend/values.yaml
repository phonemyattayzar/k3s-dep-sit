replicaCount: 1

image:
  repository: 051131628511.dkr.ecr.ap-southeast-1.amazonaws.com/sar-mel-frontend
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-pull-secret

ingress:
  enabled: false

backend:
  serviceName: sar-mel-backend
  serviceNamespace: sar-mel
  servicePort: 8000
  proxyApi: true

autoscaling:
  enabled: false

config:
  apiBaseUrl: "/api/v1"

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: false

service:
  type: ClusterIP
  port: 80
  annotations: {}

route:
  enabled: true
  hostname: sar-mel.dat.com

podAnnotations:
  sar-mel.dat.com/image-digest: sha256:35b872de7b339316f7706c9029597ea05be3b00f66599773e2bb21007e30877d
podLabels: {}
extraEnv: []
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi



