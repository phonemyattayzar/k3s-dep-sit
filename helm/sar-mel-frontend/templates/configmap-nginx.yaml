apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sar-mel-frontend.fullname" . }}-nginx
  labels:
    {{- include "sar-mel-frontend.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        location / {
            try_files $uri $uri/ /index.html;
        }

        {{- if .Values.backend.proxyApi }}
        location /api/ {
            proxy_pass http://{{ include "sar-mel-frontend.backendHost" . }}:{{ .Values.backend.servicePort }}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass http://{{ include "sar-mel-frontend.backendHost" . }}:{{ .Values.backend.servicePort }}/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        {{- end }}

        location /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
