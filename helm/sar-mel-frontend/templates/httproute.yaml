{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sar-mel-frontend.fullname" . }}
  labels:
    {{- include "sar-mel-frontend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - {{ required "route.hostname must be set when route.enabled is true" .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "sar-mel-frontend.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
