{{- if and (not .Values.registryAuth.existingSecret) .Values.registryAuth.authFile }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k3s-operator.fullname" . }}-registry-auth
  labels:
    {{- include "k3s-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: |
{{ .Values.registryAuth.authFile | indent 4 }}
{{- end }}
