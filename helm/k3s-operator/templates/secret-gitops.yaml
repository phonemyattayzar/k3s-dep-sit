{{- if and (not .Values.gitops.existingSecretName) .Values.gitops.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k3s-operator.fullname" . }}-gitops
  labels:
    {{- include "k3s-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gitops.token | quote }}
{{- end }}
