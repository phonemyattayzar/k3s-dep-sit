# PostgreSQL chart customization. Set auth.password in a private values file;
# never commit a real database password to Git.
image:
  repository: postgres
  tag: "18.6-bookworm"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: postgres

auth:
  username: appuser
  database: appdb
  # Required. Set in helm/postgres/values-private.yaml (ignored by Git).
  password: ""

service:
  port: 5432

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 8Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch
