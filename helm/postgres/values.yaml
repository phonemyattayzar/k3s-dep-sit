# PostgreSQL chart customization. Set auth.password in a private values file;
# never commit a real database password to Git.
image:
  repository: postgres
  tag: "18.6-bookworm"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: postgres

auth:
  username: appuser
  database: appdb
  # Required. Set in helm/postgres/values-private.yaml (ignored by Git).
  password: ""

service:
  port: 5432

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 8Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Pod-level security context (volume ownership)
podSecurityContext:
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch

# Container-level security context.
# Running as the postgres user (UID/GID 999 on Debian images) makes the
# image entrypoint skip `gosu`. Use 70 instead of 999 for -alpine images.
#
# TEST ONLY: seccomp/AppArmor are set to Unconfined to check whether the node's
# security layer blocks signals between Postgres processes (kill -> EPERM).
# If this fixes the hang, find which of the two is responsible and relax only
# that one; then remove the other line to restore the default (RuntimeDefault).
containerSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  seccompProfile:
    type: Unconfined
  appArmorProfile:
    type: Unconfined

# Size of the in-memory /dev/shm volume (default in containers is only 64Mi)
shmSize: 256Mi

# Extra postgres server arguments, e.g.:
# extraArgs:
#   - "-c"
#   - "io_method=sync"
extraArgs: []

probes:
  # Disabled while debugging so Kubernetes does not kill a slow/hung start.
  # Enable again (with startup enabled) once Postgres starts normally.
  startup:
    enabled: false
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    enabled: false
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6