apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:phonemyattayzar/k3s-dep-sit.git
    targetRevision: main
    path: helm/k3s-operator
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
