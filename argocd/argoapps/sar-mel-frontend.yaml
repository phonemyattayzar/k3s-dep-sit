apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sar-mel-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:phonemyattayzar/k3s-dep-sit.git
    targetRevision: main
    path: helm/sar-mel-frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sar-mel
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
