apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:phonemyattayzar/k3s-dep-sit.git
    targetRevision: main
    path: kustomize/overlay/production
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: ecr-pull-secret
      namespace: default
      jsonPointers:
        - /data/.dockerconfigjson
    - group: ""
      kind: Secret
      name: ecr-pull-secret
      namespace: sar-mel
      jsonPointers:
        - /data/.dockerconfigjson
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
