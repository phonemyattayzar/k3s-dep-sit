apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    # Replace this with the Git remote for this repository before applying.
    repoURL: https://github.com/REPLACE_ME/k3s-dep-dat.git
    targetRevision: main
    path: argocd/argoapps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
