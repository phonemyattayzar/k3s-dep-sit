apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-pull-secret-refresher
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-pull-secret"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-pull-secret-refresher
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresher
    namespace: ecr-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-pull-secret-refresher
