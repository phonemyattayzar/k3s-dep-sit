# Example private PKI chain for the Envoy Gateway HTTPS listener:
# self-signed root -> intermediate CA -> *.dat.com wildcard leaf certificate.
# Requires cert-manager to be installed before applying these resources.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: envoy-root-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Envoy Gateway Root CA
  secretName: envoy-root-ca
  duration: 87600h # 10 years; plan and distribute trust before renewal.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: envoy-root-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: envoy-root-ca
spec:
  ca:
    # ClusterIssuer CA secrets are read from cert-manager's cluster resource namespace.
    secretName: envoy-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Envoy Gateway Intermediate CA
  secretName: envoy-intermediate-ca
  duration: 43800h # 5 years; shorter than the root CA.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: envoy-root-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: envoy-intermediate-ca
spec:
  ca:
    secretName: envoy-intermediate-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-gateway-tls
  namespace: envoy-gateway-system
spec:
  secretName: envoy-gateway-tls
  duration: 2160h # 90 days
  renewBefore: 360h # renew 15 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "*.dat.com"
  usages:
    - server auth
  issuerRef:
    name: envoy-intermediate-ca
    kind: ClusterIssuer
    group: cert-manager.io
